# CI (ПР7): проверка проекта на каждый push и pull request.
# Шаги: зависимости -> линтер -> проверка миграций -> тесты с покрытием -> сборка образов
# -> запуск всей системы через docker compose и проверка /health и входа.
# Любой упавший шаг останавливает пайплайн: если падает тест, сборка образов не запускается,
# и коммит на GitHub помечается красным крестом.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Линтер и тесты (booking-service)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: booking-service
    services:
      # Временная база только для тестов этого запуска: пароль не нужен (trust), после job она удаляется.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carsharing
          POSTGRES_USER: carsharing
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carsharing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: carsharing
      DB_USER: carsharing
      DB_PASSWORD: not-used-with-trust-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: booking-service/requirements*.txt

      - name: Секреты для тестов (случайные, только на этот запуск)
        run: |
          echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check . --output-format=github

      - name: Миграции соответствуют моделям
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты (модульные, API, безопасность) с покрытием
        run: |
          python -m coverage run manage.py test tests --shuffle
          python -m coverage report --fail-under=95

  docker:
    name: Сборка образов и запуск системы
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: .env со случайными секретами (в репозитории секретов нет)
        run: |
          gen() { python3 -c 'import secrets; print(secrets.token_urlsafe(48))'; }
          {
            echo "DB_PASSWORD=$(gen)"
            echo "DJANGO_SECRET_KEY=$(gen)$(gen)"
            echo "JWT_SECRET=$(gen)"
            echo "METRICS_TOKEN=$(gen)"
            echo "SEED_DEMO=true"
          } > .env

      - name: Сборка образов
        run: docker compose build

      - name: Запуск всей системы (миграции применяются автоматически)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Проверка работающей системы
        run: |
          docker compose ps
          curl -fsS http://localhost:8010/health
          curl -fsS http://localhost:8020/health
          curl -fsS -X POST http://localhost:8010/api/v1/auth/login -H "Content-Type: application/json" \
            -d '{"email":"admin@carsharing.kz","password":"Steppe#Falcon2026"}' | grep -q access_token
          curl -fsS "http://localhost:8010/api/v1/cars?limit=1" | grep -q '"total"'

      - name: Логи контейнеров при сбое
        if: failure()
        run: docker compose logs --no-color

      - name: Остановка
        if: always()
        run: docker compose down -v
